<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --link: #0969da;
  --border: #d1d9e0;
  --code: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #f0f6fc;
    --link: #4493f8;
    --border: #3d444d;
    --code: #151b23;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Hiragino Sans", "PingFang SC", "Microsoft JhengHei", Helvetica, Arial, sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: var(--link); }
img { max-width: 100%; height: auto; }
code { background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.9em; overflow-wrap: anywhere; }
table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
h1, h2 { line-height: 1.25; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
